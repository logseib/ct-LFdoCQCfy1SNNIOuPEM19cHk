<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Card Tracker</title>
<style>
  :root{--bg:#efe9df;--ink:#16233f;--muted:#6f6a60;--accent:#1d3fa8;--warm:#d9622b;--line:#d6cfc2}
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
  main{max-width:440px;margin:0 auto;padding:44px 22px 48px}
  h1{font:600 11px/1 -apple-system,Helvetica,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 28px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .card{background:transparent;border:0;border-left:3px solid var(--warm);padding:4px 0 4px 18px}
  .label{font:600 10px/1 -apple-system,Helvetica,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.18em}
  #holder{font-size:44px;font-weight:400;margin:10px 0 4px;letter-spacing:-.01em}
  #since{color:var(--muted);font-size:14px;font-style:italic}
  button{width:100%;margin:16px 0 34px;padding:17px;font:600 15px -apple-system,Helvetica,sans-serif;letter-spacing:.06em;border:0;border-radius:2px;background:var(--accent);color:#fff;cursor:pointer}
  button:active{background:var(--warm)}
  button:disabled{opacity:.5}
  #history{list-style:none;margin:12px 0 0;padding:0;max-height:48vh;overflow-y:auto;border-top:1px solid var(--ink)}
  #history li{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font-size:17px}
  #history .t{color:var(--muted);font:12px/1.4 -apple-system,Helvetica,sans-serif;text-align:right}
  #nameBox{position:fixed;inset:0;background:rgba(239,233,223,.94);display:none;align-items:center;justify-content:center;padding:24px}
  #nameBox .card{width:100%;max-width:340px}
  #nameBox input{width:100%;padding:12px 0;font:22px Georgia,serif;border:0;border-bottom:1px solid var(--ink);background:transparent;margin-top:14px;outline:none}
  #nameBox button{margin:20px 0 0}
  .foot{font:13px -apple-system,Helvetica,sans-serif;color:var(--muted);margin-top:18px}
  .foot a{color:var(--warm)}
  #mode{font:11px -apple-system,Helvetica,sans-serif;color:var(--warm);margin-bottom:14px;display:none}
</style>
</head>
<body>
<main>
  <h1>Who has the card</h1>
  <div id="mode">Demo mode: Firebase isn't configured, so entries are saved on this device only.</div>
  <div class="card">
    <div class="label">Current holder</div>
    <div id="holder">—</div>
    <div id="since">Loading…</div>
  </div>
  <div class="foot" style="margin:22px 0 -2px;font-size:14px">You are <b id="me">?</b> · <a href="#" id="rename">not you?</a></div>
  <button id="claim">I have the card now</button>
  <div class="label">History</div>
  <ul id="history"></ul>
</main>

<div id="nameBox"><div class="card">
  <div class="label">What's your name?</div>
  <input id="nameInput" maxlength="30" autocomplete="given-name" placeholder="First name">
  <button id="saveName">Save</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== 1. Paste your Firebase web config here =====
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "PASTE_APP_ID"
};
// ==================================================

const $ = id => document.getElementById(id);
const NAME_KEY = "cardTrackerName";
const demo = firebaseConfig.apiKey.startsWith("PASTE");
let db;

function fmt(ms){
  const d = new Date(ms);
  return {
    day: d.toLocaleDateString(undefined,{weekday:"long"}),
    date: d.toLocaleDateString(undefined,{month:"short",day:"numeric"}),
    time: d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})
  };
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(entries){ // newest first
  if(!entries.length){ $("holder").textContent="Nobody yet"; $("since").textContent="Tap the button when you have it."; $("history").innerHTML=""; return; }
  const cur = entries[0], f = fmt(cur.ts);
  $("holder").textContent = cur.name;
  $("since").textContent = `since ${f.time}, ${f.day} ${f.date}`;
  $("history").innerHTML = entries.map(e=>{const g=fmt(e.ts);return `<li><span>${esc(e.name)}</span><span class="t">${g.day}, ${g.date}<br>${g.time}</span></li>`}).join("");
}

// ----- name handling -----
function myName(){ return localStorage.getItem(NAME_KEY) }
function askName(){ $("nameBox").style.display="flex"; $("nameInput").value=myName()||""; $("nameInput").focus(); }
$("saveName").onclick = () => {
  const n = $("nameInput").value.trim();
  if(!n) return;
  localStorage.setItem(NAME_KEY,n); $("me").textContent=n; $("nameBox").style.display="none";
};
$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("saveName").click()});
$("rename").onclick = e => { e.preventDefault(); askName(); };
if(myName()) $("me").textContent=myName(); else askName();

// ----- data -----
if(demo){
  $("mode").style.display="block";
  const load=()=>JSON.parse(localStorage.getItem("cardTrackerDemo")||"[]");
  render(load());
  window.addEventListener("storage",()=>render(load()));
  window.addClaim = async name => { const a=load(); a.unshift({name,ts:Date.now()}); localStorage.setItem("cardTrackerDemo",JSON.stringify(a)); render(a); };
} else {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.collection("claims").orderBy("ts","desc").limit(500).onSnapshot(snap=>{
    render(snap.docs.map(d=>{const x=d.data();return {name:x.name, ts: x.ts ? x.ts.toMillis() : Date.now()}}));
  }, err=>{ $("since").textContent="Couldn't load: "+err.message; });
  window.addClaim = name => db.collection("claims").add({name, ts: firebase.firestore.FieldValue.serverTimestamp()});
}

$("claim").onclick = async () => {
  const n = myName(); if(!n){ askName(); return; }
  $("claim").disabled = true;
  try{ await addClaim(n); } catch(e){ alert("Couldn't save: "+e.message); }
  setTimeout(()=>$("claim").disabled=false, 1500);
};
</script>
</body>
</html>
